name: mixsocial_mobile
description: A local-first mobile client for the mixsocial sources.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_staggered_grid_view: ^0.7.0
  mixsocial_core:
    path: packages/mixsocial_core
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  video_player: ^2.11.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
