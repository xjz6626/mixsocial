name: mixsocial_core
description: Flutter platform bridge for mixsocial's local Go core.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.xjz.mixsocial.core
        pluginClass: MixsocialCorePlugin
